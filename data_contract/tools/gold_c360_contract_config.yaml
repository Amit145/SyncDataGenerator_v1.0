purpose: Validate C360 gold layer tables before downstream processing.
limitations: Generated from layer metadata workbooks; review business descriptions
  and column-level rules when physical schema is available.
usage: Used as a gold layer contract config for ODCS contract generation and validation.
frequency: 1
frequencyUnit: d
latency: 24
latencyUnit: h
retention: 7
retentionUnit: y
teamName: Data Modelling & Engineering CoE
firstLevelApprovers: C360 Gold Data Owner
secondLevelApprovers: Data Governance
supportChannel: coe-data-contracts
supportUrl: mailto:coe-data-contracts@example-internal
tables:
  dim_geography:
    name: dim_geography
    primaryKey: geography_sk
    businessKey:
    - city
    - state
    - country
    - region
    businessName: Dim Geography
    grain: One row per city, state, country, region.
    columns:
      geography_sk:
        required: true
      city:
        required: true
      state:
        required: true
      country:
        required: true
      region:
        required: true
    metadata:
      tableId: tab_0069
      catalogName: dev_allianz_raw
      schemaName: bvault_gold
      stage: gold
      scd2: false
    sourceTable: dev_allianz_raw.bvault_silver.bv_address_master
    sourcePrimaryKey:
    - city
    - state
    - country
    - region
    tableRules:
    - ruleId: rule_0002
      ruleName: Missing Keys Check
      type: sql
      query: select (select count(distinct({source_pk})) from {source_table} ) - count(distinct
        ({table_bk})) as missing_keys from {full_table_name} a
      mustBe:
        missing_keys: 0
      dimension: reconciliation
      severity: warning
      description: Checks missing value between source and target
      failureAction: warn
      referencedColumns:
      - city
      - state
      - country
      - region
  dim_identity:
    name: dim_identity
    primaryKey: identity_sk
    businessKey: identity_id
    businessName: Dim Identity
    grain: One row per identity_id.
    columns:
      identity_sk:
        required: true
      identity_id:
        required: true
      effective_from_ts:
        required: true
      effective_to_ts:
        required: true
    metadata:
      tableId: tab_0071
      catalogName: dev_allianz_raw
      schemaName: bvault_gold
      stage: gold
      scd2: true
    sourceTable: dev_allianz_raw.bvault_silver.hub_identities
    sourcePrimaryKey: identities_id
    tableRules:
    - ruleId: rule_0004
      ruleName: SCD2 Effective Dates Check
      type: sql
      query: select count(*) as invalid_intervals from {full_table_name} a where {target_watermak_exp}
        and (effective_to_ts < '9999-12-31T00:00:00.000+00:00' and effective_from_ts
        >= effective_to_ts)
      mustBe:
        invalid_intervals: 0
      dimension: SCD2 validity
      severity: warning
      description: effective start date should be less than effective end date
      failureAction: warn
      referencedColumns:
      - effective_from_ts
      - effective_to_ts
    - ruleId: rule_0005
      ruleName: Overlapping Period Check
      type: sql
      query: select count(*) as bk_with_overlapping_interval from ( select count(*),
        {table_bk} from {full_table_name} a join {full_table_name} b on {table_bk_join}
        and a.{target_watermak_exp}  and b.{target_watermak_exp} and not (a.effective_to_ts
        <= b.effective_from_ts or b.effective_to_ts <= a.effective_from_ts) and (a.effective_from_ts,
        a.effective_to_ts) <> (b.effective_from_ts, b.effective_to_ts) group by {table_bk}
        ) t
      mustBe:
        bk_with_overlapping_interval: 0
      dimension: SCD2 validity
      severity: warning
      description: There should not be any overlapping period for each bussiness key
      failureAction: warn
      referencedColumns:
      - identity_id
    - ruleId: rule_0006
      ruleName: Duplicate Active Records Check
      type: sql
      query: select count(*) as bk_with_dup_active_record from ( select count(*) as
        active_record,{table_bk} from {full_table_name} a where effective_to_ts =
        '9999-12-31T00:00:00.000+00:00' and {target_watermak_exp} group by {table_bk}
        having count(*) > 1 )t
      mustBe:
        bk_with_dup_active_record: 0
      dimension: SCD2 validity
      severity: warning
      description: This query tests for duplicate active records
      failureAction: warn
      referencedColumns:
      - identity_id
    - ruleId: rule_0002
      ruleName: Missing Keys Check
      type: sql
      query: select (select count(distinct({source_pk})) from {source_table} ) - count(distinct
        ({table_bk})) as missing_keys from {full_table_name} a
      mustBe:
        missing_keys: 0
      dimension: reconciliation
      severity: warning
      description: Checks missing value between source and target
      failureAction: warn
      referencedColumns:
      - identity_id

purpose: "Validate enhanced PRD1 vault_ready_28 raw source files before silver/vault ingestion."
limitations: "Generated from synthetic enhanced source data; review business descriptions before approval."
usage: "Used as an ingestion gate and DQ metadata source for enhanced PRD1 raw."

frequency: 1
frequencyUnit: d
latency: 24
latencyUnit: h
retention: 7
retentionUnit: y

teamName: "Data Modelling & Engineering CoE"
firstLevelApprovers: "Enhanced Data Owner"
secondLevelApprovers: "Data Governance"
supportChannel: "coe-data-contracts"
supportUrl: "mailto:coe-data-contracts@example-internal"

tables:
  account_book.csv:
    primaryKey: account_ref
    businessKey: account_ref
  address_book.csv:
    primaryKey: address_ref
    businessKey: address_ref
  broker_book.csv:
    primaryKey: src_broker_ref
    businessKey: src_broker_ref
  campaign_register.csv:
    primaryKey: src_campaign_ref
    businessKey: src_campaign_ref
  campaign_touch.csv:
    primaryKey: engagement_ref
    businessKey: engagement_ref
  channel_catalog.csv:
    primaryKey: src_channel_ref
    businessKey: src_channel_ref
  claim_register.csv:
    primaryKey: src_claim_ref
    businessKey: src_claim_ref
    tableRules:
      - ruleId: dq_enh_claim_amounts_non_negative
        ruleName: Enhanced claim amounts non-negative
        type: sql
        query: >
          SELECT COUNT(*) AS invalid_amounts
          FROM {full_table_name}
          WHERE (src_claim_amount < 0 OR src_claims_paid < 0 OR src_outstanding_reserve < 0 OR src_claims_expenses < 0)
            AND {target_watermak_exp}
        mustBe:
          invalid_amounts: 0
        dimension: accuracy
        severity: error
        description: "Enhanced claim financial amount fields must not be negative."
        referencedColumns:
          - src_claim_amount
          - src_claims_paid
          - src_outstanding_reserve
          - src_claims_expenses
        failureAction: reject
  comm_preference.csv:
    primaryKey: preference_ref
    businessKey: preference_ref
  complaint_register.csv:
    primaryKey: src_complaint_ref
    businessKey: src_complaint_ref
  consent_snapshot.csv:
    primaryKey: consent_ref
    businessKey: consent_ref
  contact_point.csv:
    primaryKey: contact_ref
    businessKey: contact_ref
  customer_lead_bridge.csv:
    primaryKey:
      - customer_ref
      - lead_ref
    businessKey:
      - customer_ref
      - lead_ref
  customer_portfolio.csv:
    primaryKey: customer_ref
    businessKey: customer_ref
  enhanced_address_book.csv:
    primaryKey: src_address_ref
    businessKey: src_address_ref
  enhanced_enrichments.csv:
    allowNoPrimaryKey: true
    businessName: Enhanced Enrichments
    grain: "Sparse grouped enrichment rows across customer, marketing, motor, policy, quote, and financial extracts."
  enhanced_person_relationships.csv:
    allowNoPrimaryKey: true
    businessName: Enhanced Person Relationships
    grain: "Sparse grouped relationship rows for broker-person, person-address, and person-campaign relationships."
  enhanced_policy_relationships.csv:
    allowNoPrimaryKey: true
    businessName: Enhanced Policy Relationships
    grain: "Sparse grouped relationship rows for claim, complaint, insured object, broker, channel, policy, quote, and regulation links."
  identity_registry.csv:
    primaryKey: identity_ref
    businessKey: identity_ref
  lead_register.csv:
    primaryKey: lead_ref
    businessKey: lead_ref
  override_register.csv:
    primaryKey: src_override_ref
    businessKey: src_override_ref
  party_master.csv:
    primaryKey: party_ref
    businessKey: party_ref
  policy_register.csv:
    primaryKey: policy_ref
    businessKey: policy_ref
  product_catalog.csv:
    primaryKey: product_ref
    businessKey: product_ref
  property_asset.csv:
    primaryKey: property_ref
    businessKey: property_ref
  quote_register.csv:
    primaryKey: quote_ref

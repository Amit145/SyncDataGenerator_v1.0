purpose: "Validate policy PRD1 CRM raw source files before ingestion."
limitations: "Generated from synthetic policy CRM source data; review business descriptions before production approval."
usage: "Used as an ingestion gate and DQ metadata source for policy PRD1 raw."

frequency: 1
frequencyUnit: d
latency: 24
latencyUnit: h
retention: 7
retentionUnit: y

teamName: "Data Modelling & Engineering CoE"
firstLevelApprovers: "Policy Data Owner"
secondLevelApprovers: "Data Governance"
supportChannel: "coe-data-contracts"
supportUrl: "mailto:coe-data-contracts@example-internal"

tables:
  party_master.csv:
    primaryKey: party_ref
    businessKey: party_ref
    businessName: Policy CRM Party Master
    grain: "One row per party_ref per batch."
    columns:
      batch_ref:
        required: true
      pull_ts:
        required: true
      origin_sys:
        required: true
        allowedValues:
          - CRM
      party_ref:
        required: true
      party_kind:
        required: true
  contact_point.csv:
    primaryKey: contact_ref
    businessKey: contact_ref
  address_book.csv:
    primaryKey: address_ref
    businessKey: address_ref
  customer_portfolio.csv:
    primaryKey: customer_ref
    businessKey: customer_ref
  account_book.csv:
    primaryKey: account_ref
    businessKey: account_ref
  product_catalog.csv:
    primaryKey: product_ref
    businessKey: product_ref
  quote_register.csv:
    primaryKey: quote_ref
    businessKey: quote_ref
  policy_register.csv:
    primaryKey: policy_ref
    businessKey: policy_ref
    businessName: Policy CRM Register
    grain: "One row per policy_ref per batch."
    columns:
      origin_sys:
        required: true
        allowedValues:
          - CRM
      policy_ref:
        required: true
      policy_no:
        required: true
      policy_start_dt:
        required: true
      policy_end_dt:
        required: true
      renewal_premium_curr:
        minValue: 0
      renewal_premium_next:
        minValue: 0
      gross_amt:
        minValue: 0
      net_amt:
        minValue: 0
      fraud_ind:
        allowedValues:
          - Y
          - N
      is_auto_renew_enabled:
        allowedValues:
          - Y
          - N
      is_direct_debit_cancellation:
        allowedValues:
          - Y
          - N
      is_installment_default:
        allowedValues:
          - Y
          - N
      is_renewal_escalation:
        allowedValues:
          - Y
          - N
    tableRules:
      - ruleId: dq_policy_dates_valid
        ruleName: Policy start date before end date
        type: sql
        query: >
          SELECT COUNT(*) AS invalid_dates
          FROM {full_table_name}
          WHERE to_date(policy_start_dt) > to_date(policy_end_dt)
            AND {target_watermak_exp}
        mustBe:
          invalid_dates: 0
        dimension: accuracy
        severity: error
        description: "Policy start date must not be after policy end date."
        referencedColumns:
          - policy_start_dt
          - policy_end_dt
        failureAction: reject
  property_asset.csv:
    primaryKey: property_ref
    businessKey: property_ref
  vehicle_asset.csv:
    primaryKey: vehicle_ref
    businessKey: vehicle_ref
  coverage_catalog.csv:
    primaryKey: coverage_ref
    businessKey: coverage_ref
  policy_coverage.csv:
    primaryKey: policy_coverage_ref
    businessKey: policy_coverage_ref
    columns:
      sum_insured_amt:
        minValue: 0
      gross_annual_premium_amt:
        minValue: 0
      deductible_amt:
        minValue: 0
      automatic_indexation_ind:
        allowedValues:
          - Y
          - N
  billing_register.csv:
    primaryKey: billing_ref
    businessKey: billing_ref
    columns:
      annual_premium_amt:
        minValue: 0
      billed_premium_amt:
        minValue: 0
      paid_premium_amt:
        minValue: 0

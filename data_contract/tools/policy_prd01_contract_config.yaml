purpose: "Validate policy PRD1 CRM raw source files before ingestion."
limitations: "Generated from the latest policy input workbook. Columns are lowercase snake_case raw attributes."
usage: "Used as an ingestion gate and DQ metadata source for policy PRD1 raw."

frequency: 1
frequencyUnit: d
latency: 24
latencyUnit: h
retention: 7
retentionUnit: y

teamName: "Data Modelling & Engineering CoE"
firstLevelApprovers: "Policy Data Owner"
secondLevelApprovers: "Data Governance"
supportChannel: "coe-data-contracts"
supportUrl: "mailto:coe-data-contracts@example-internal"

tables:
  billing.csv:
    primaryKey: billing_identifier
    businessKey: billing_identifier
    columns:
      policy_identifier:
        required: true
      annual_premium_amount:
        minValue: 0
      billed_premium_amount:
        minValue: 0
      net_premium_amount:
        minValue: 0
      outstanding_amount:
        minValue: 0

  claim.csv:
    primaryKey: claim_identifier
    businessKey: claim_identifier
    columns:
      policy_identifier:
        required: true
      loss_event_identifier:
        required: true
      claim_amt:
        minValue: 0
      claims_paid:
        minValue: 0
      total_incurred:
        minValue: 0

  coverage.csv:
    primaryKey: coverage_identifier
    businessKey: coverage_identifier
    columns:
      coverage_code:
        required: true
      maximum_deductible:
        minValue: 0
      default_limit:
        minValue: 0

  event_type.csv:
    primaryKey: event_type_identifier
    businessKey: event_type_code

  geography.csv:
    primaryKey: geography_identifier
    businessKey: geography_identifier
    columns:
      city:
        required: true
      country:
        required: true
      state:
        required: true

  home.csv:
    primaryKey: insured_object_identifier
    businessKey: insured_object_identifier
    columns:
      geography_identifier:
        required: true
      policy_identifier:
        required: true
      insured_value:
        minValue: 0

  loss_event.csv:
    primaryKey: loss_event_identifier
    businessKey: loss_event_identifier
    columns:
      insured_object_identifier:
        required: true
      geography_identifier:
        required: true

  motor.csv:
    primaryKey: insured_object_identifier
    businessKey: insured_object_identifier
    columns:
      geography_identifier:
        required: true
      policy_identifier:
        required: true
      insured_value:
        minValue: 0

  person.csv:
    primaryKey: person_identifier
    businessKey: person_identifier
    columns:
      geography_identifier:
        required: true
      person_type:
        required: true

  policy.csv:
    primaryKey: policy_identifier
    businessKey: policy_identifier
    columns:
      policy_number:
        required: true
      policy_start_date:
        required: true
      policy_end_date:
        required: true
      product_identifier:
        required: true
      is_fraud:
        allowedValues:
          - Y
          - N
      is_auto_renew_enabled:
        allowedValues:
          - Y
          - N
      is_policy_renewal:
        allowedValues:
          - Y
          - N
      is_renewal_escalation:
        allowedValues:
          - Y
          - N
      policy_sum_insured:
        minValue: 0
      policy_base_premium:
        minValue: 0
      policy_retention_limit:
        minValue: 0
      limit_for_indemnification:
        minValue: 0

  policy_coverage.csv:
    primaryKey: policy_coverage_identifier
    businessKey: policy_coverage_identifier
    columns:
      policy_identifier:
        required: true
      coverage_identifier:
        required: true
      coverage_amount:
        minValue: 0
      deductible_amount:
        minValue: 0
      coverage_limit_amount:
        minValue: 0
      gross_premium:
        minValue: 0

  policy_event.csv:
    primaryKey: policy_event_identifier
    businessKey: policy_event_identifier
    columns:
      policy_identifier:
        required: true
      event_type_identifier:
        required: true
      premium_impact_amount:
        minValue: 0

  policy_participant.csv:
    primaryKey: policy_participant_identifier
    businessKey: policy_participant_identifier
    columns:
      policy_identifier:
        required: true
      person_identifier:
        required: true
      role_identifier:
        required: true
      primary_indicator:
        allowedValues:
          - Y
          - N

  product.csv:
    primaryKey: product_identifier
    businessKey: product_identifier

  quote.csv:
    primaryKey: quote_identifier
    businessKey: quote_identifier
    columns:
      product_identifier:
        required: true
      person_identifier:
        required: true
      quoted_gross_premium_amount:
        minValue: 0
      quoted_net_premium_amount:
        minValue: 0
      quote_premium:
        minValue: 0

  risk_assessment.csv:
    primaryKey: risk_assessment_identifier
    businessKey: risk_assessment_identifier
    columns:
      insured_object_identifier:
        required: true
      risk_score:
        minValue: 0
      exposure_amount:
        minValue: 0
      claim_amount:
        minValue: 0
      total_incurred_amount:
        minValue: 0

  role.csv:
    primaryKey: role_identifier
    businessKey: role_code

  sales_channel.csv:
    primaryKey: sales_channel_identifier
    businessKey: sales_channel_identifier

purpose: "Validate policy PRD2 SAP raw source files before ingestion."
limitations: "Generated from the latest policy input workbook. SAP PRD2 supplies policy, coverage, and policy coverage only."
usage: "Used as an ingestion gate and DQ metadata source for policy PRD2 raw."

frequency: 1
frequencyUnit: d
latency: 24
latencyUnit: h
retention: 7
retentionUnit: y

teamName: "Data Modelling & Engineering CoE"
firstLevelApprovers: "Policy Data Owner"
secondLevelApprovers: "Data Governance"
supportChannel: "coe-data-contracts"
supportUrl: "mailto:coe-data-contracts@example-internal"

tables:
  policy.csv:
    primaryKey: policy_identifier
    businessKey: policy_identifier
    columns:
      policy_number:
        required: true
      policy_start_date:
        required: true
      policy_end_date:
        required: true
      product_identifier:
        required: true
      is_fraud:
        allowedValues:
          - Y
          - N
      is_auto_renew_enabled:
        allowedValues:
          - Y
          - N
      is_policy_renewal:
        allowedValues:
          - Y
          - N
      policy_sum_insured:
        minValue: 0
      policy_base_premium:
        minValue: 0
      policy_retention_limit:
        minValue: 0
      limit_for_indemnification:
        minValue: 0

  coverage.csv:
    primaryKey: coverage_identifier
    businessKey: coverage_identifier
    columns:
      coverage_code:
        required: true
      maximum_deductible:
        minValue: 0
      default_limit:
        minValue: 0

  policy_coverage.csv:
    primaryKey: policy_coverage_identifier
    businessKey: policy_coverage_identifier
    columns:
      policy_identifier:
        required: true
      coverage_identifier:
        required: true
      coverage_amount:
        minValue: 0
      deductible_amount:
        minValue: 0
      coverage_limit_amount:
        minValue: 0
      gross_premium:
        minValue: 0

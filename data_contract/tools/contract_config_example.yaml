# Optional overrides for data_contract/tools/create_data_contract.py.
# Use this when inferred keys, classifications, descriptions, or SLA values need review control.

purpose: "Validate raw claims source files before bronze ingestion."
limitations: "Generated from synthetic source data; review business descriptions before approval."
usage: "Used as an ingestion gate and DQ metadata source."

frequency: 1
frequencyUnit: d
latency: 24
latencyUnit: h
retention: 7
retentionUnit: y

teamName: "Data Modelling & Engineering CoE"
firstLevelApprovers: "Claims Data Owner"
secondLevelApprovers: "Data Governance"
supportChannel: "coe-data-contracts"
supportUrl: "mailto:coe-data-contracts@example-internal"

tables:
  claim_register.csv:
    primaryKey: claim_identifier
    businessKey: claim_identifier
    businessName: Claim Register
    grain: "One row per claim_identifier per batch."
    tableRules:
      - ruleId: dq_claim_register_amounts_non_negative
        ruleName: Claim amounts non-negative
        type: sql
        query: >
          SELECT COUNT(*) AS invalid_amounts
          FROM {full_table_name}
          WHERE (claim_requested_amount < 0 OR total_incurred < 0 OR total_payment_amount < 0)
            AND {target_watermak_exp}
        mustBe:
          invalid_amounts: 0
        dimension: accuracy
        severity: error
        description: "Claim financial amount fields must not be negative."
        referencedColumns:
          - claim_requested_amount
          - total_incurred
          - total_payment_amount
        failureAction: reject
    columns:
      claim_status:
        required: true
        allowedValues:
          - Open
          - Closed
          - Reopened
      claim_requested_amount:
        required: true
        minValue: 0
        columnRules:
          - ruleId: dq_claim_requested_amount_not_null
            ruleName: Claim requested amount not null
            type: library
            metric: nullValues
            mustBe: 0
            dimension: completeness
            severity: error
            description: "claim_requested_amount must be populated."
            failureAction: reject
  policy_register.csv:
    primaryKey: policy_identifier
    businessKey: policy_identifier
    businessName: Policy Register
    grain: "One row per policy_identifier per batch."
  claim.csv:
    primaryKey: claim_ref_id
    businessKey: claim_ref_id
    businessName: Claim
    grain: "One row per claim_ref_id per batch."

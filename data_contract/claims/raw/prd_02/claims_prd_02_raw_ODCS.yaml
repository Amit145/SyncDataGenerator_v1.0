# =============================================================================
# Data Contract - Claims raw source feed prd_02
# ODCS v3.1.0
# =============================================================================

kind: DataContract
apiVersion: v3.1.0
id: "claims-prd-02-raw-0001"
name: "Claims PRD 02 Raw Source Feed"
version: "1.0.0"
status: draft
domain: claims
tenant: "Allianz"

description:
  purpose: >
    Defines the raw source contract for the claims PRD 02 feed before raw-to-bronze
    ingestion. The feed currently contains claim, claim investigation, and loss
    event CSV files from the SAP/source-2 claims view.
  limitations: "Synthetic source extract generated for the claims data pipeline."
  usage: "Validate raw PRD 02 claims files before bronze ingestion."

authoritativeDefinitions:
  - type: canonical
    url: "data_contract/claims/raw/prd_02/claims_prd_02_raw_ODCS.yaml"
    description: "Repository copy of the claims PRD 02 raw source contract"

servers:
  - server: claims-prd-02-local-raw
    type: local
    path: "data/raw/claims/{batch_ref}/prd_02/*.csv"
    format: csv

schema:
  - id: claim
    name: claim
    physicalName: claim.csv
    physicalType: table
    businessName: Claim
    description: "Raw PRD 02 claim-level source records."
    tags: ["claims", "raw", "prd_02", "source_feed"]
    dataGranularityDescription: "One row per source claim reference per batch."
    properties:
      - id: batch_ref
        name: batch_ref
        logicalType: integer
        physicalType: bigint
        required: true
        classification: internal
        description: "Pipeline batch reference for the source extract."
      - id: pull_ts
        name: pull_ts
        logicalType: timestamp
        physicalType: timestamp
        required: true
        classification: internal
        description: "Timestamp when the source feed was pulled."
      - id: origin_sys
        name: origin_sys
        logicalType: string
        physicalType: varchar(32)
        required: true
        classification: internal
        description: "Originating source system code."
        quality:
          - metric: invalidValues
            mustBe: 0
            dimension: conformity
            type: library
            severity: error
            description: "origin_sys must contain expected source system values."
            arguments:
              validValues: ["SAP"]
      - id: claim_ref_id
        name: claim_ref_id
        logicalType: string
        physicalType: varchar(64)
        required: true
        unique: true
        primaryKey: true
        primaryKeyPosition: 1
        criticalDataElement: true

        physicalType: varchar(64)
        required: true
        unique: true
        classification: internal
        description: "Third-party claim reference."
      - id: claim_stage
        name: claim_stage
        logicalType: string
        physicalType: varchar(64)
        required: true
        classification: internal
        description: "Current claim processing stage."
      - id: case_state
        name: case_state
        logicalType: string
        physicalType: varchar(64)
        required: true
        classification: internal
        description: "Current state of the claim case."
      - id: stage_update_date
        name: stage_update_date

  - channel: coe-data-contracts
    tool: email
    url: "mailto:coe-data-contracts@example-internal"

tags: ["claims", "raw", "prd_02", "source_contract"]

customProperties:
  - property: allianzClassification
    value: Internal
  - property: containsPersonalData
    value: false
  - property: sourceSystem
    value: SAP
  - property: sourceFeed
    value: prd_02
  - property: pipelineLayer
    value: raw
  - property: expectedFiles
    value: ["claim.csv", "claim_investigation.csv", "loss_event.csv"]
  - property: notebookValidationConfig
    value:
      contractReader: "yaml.safe_load"
      schemaObjectPath: "schema"
      qualityRulesPath: "schema[].quality"
      ruleCatalogPath: "customProperties[property=dqRuleCatalog].value"
      sourceFileField: physicalName
      entityField: name
      batchParameter: batch_ref
      defaultTargetWatermakExp: "batch_ref = '{batch_ref}'"
      placeholderStyle: "python_format"
      placeholders:
        full_table_name: "Databricks temp view or fully qualified table name for the current source object"
        target_watermak_exp: "Batch filter expression used by existing ETL DQ SQL templates"
        table_pk: "Primary key column list for the current source object"
        table_bk: "Business key column list for the current source object"
        table_bk_join: "Join condition between aliases a and b for the business key"
        source_table: "Source table/view used for reconciliation checks"
        source_pk: "Source primary key used for reconciliation checks"
      entities:
        - entity: claim
          sourceFile: claim.csv
          primaryKeyColumns: ["claim_ref_id"]
          businessKeyColumns: ["claim_ref_id"]
          fullTableNamePlaceholder: claim
          targetWatermakExp: "batch_ref = '{batch_ref}'"
        - entity: claim_investigation
          sourceFile: claim_investigation.csv
          primaryKeyColumns: ["fraud_case_id"]
          businessKeyColumns: ["fraud_case_id"]
          fullTableNamePlaceholder: claim_investigation
          targetWatermakExp: "batch_ref = '{batch_ref}'"
        - entity: loss_event
          sourceFile: loss_event.csv
          primaryKeyColumns: ["incident_id"]
          businessKeyColumns: ["incident_id"]
          fullTableNamePlaceholder: loss_event
          targetWatermakExp: "batch_ref = '{batch_ref}'"
  - property: dqRuleCatalog
    value:
      sourceRuleFile: "data_contract/new 2.txt"
      activeRules:
        - ruleId: rule_0001
          ruleName: "BK Check"
          sourceRuleType: Warning
          severity: error
          ruleCategory: validity
          layer: raw
          applicableTo: ["claim", "claim_investigation", "loss_event"]
          failureAction: reject
          expectedOutcome:
            null_count: 0
          queryTemplate: "select count(*) as null_count from {full_table_name} a where ({table_bk}) is null and {target_watermak_exp}"
          queryDesc: "Business key should not be null."
        - ruleId: rule_0003
          ruleName: "Not Null Check"
          sourceRuleType: Warning
          severity: error
          ruleCategory: uniqueness
          layer: raw
          applicableTo: ["claim", "claim_investigation", "loss_event"]
          failureAction: reject
          expectedOutcome:
            pk_nulls: 0
            pk_duplicates: 0
          queryTemplate: "SELECT SUM(CASE WHEN concat({table_pk}) is null THEN 1 ELSE 0 END) AS pk_nulls, COUNT(1) - COUNT(DISTINCT {table_pk}) AS pk_duplicates FROM {full_table_name} a WHERE {target_watermak_exp}"
          queryDesc: "Primary key should be populated and unique."
        - ruleId: rule_0007
          ruleName: "BK Not Null Check"
          sourceRuleType: Warning
          severity: error
          ruleCategory: uniqueness
          layer: raw
          applicableTo: ["claim", "claim_investigation", "loss_event"]
          failureAction: reject
          expectedOutcome:
            bk_nulls: 0
            bk_duplicates: 0
          queryTemplate: "SELECT SUM(CASE WHEN concat({table_bk}) is null THEN 1 ELSE 0 END) AS bk_nulls, COUNT(1) - COUNT(DISTINCT {table_bk}) AS bk_duplicates FROM {full_table_name} a WHERE {target_watermak_exp}"
          queryDesc: "Business key should be populated and unique."
      inactiveRules:
        - ruleId: rule_0002
          ruleName: "Missing Keys Check"
          sourceRuleType: Warning
          ruleCategory: reconciliation
          reasonNotActive: "Requires a source-to-target comparison; apply when validating raw-to-bronze output, not standalone raw source arrival."
          expectedOutcome:
            missing_keys: 0
          queryTemplate: "select (select count(distinct({source_pk})) from {source_table} ) - count(distinct ({table_bk})) as missing_keys from {full_table_name} a"
        - ruleId: rule_0004
          ruleName: "SCD2 Effective Dates Check"
          sourceRuleType: Warning
          ruleCategory: "SCD2 validity"
          reasonNotActive: "Raw PRD2 source files do not contain effective_from_ts/effective_to_ts SCD2 interval columns."
        - ruleId: rule_0005
          ruleName: "Overlapping Period Check"
          sourceRuleType: Warning
          ruleCategory: "SCD2 validity"
          reasonNotActive: "Raw PRD2 source files do not contain SCD2 effective dating columns."
        - ruleId: rule_0006
          ruleName: "Duplicate Active Records Check"
          sourceRuleType: Warning
          ruleCategory: "SCD2 validity"
          reasonNotActive: "Raw PRD2 source files do not contain SCD2 active-record columns."
  - property: contractWorkstreamGuidance
    value:
      sourceDocument: "data_contract/Data Contract Workstreams and Required Tasks.docx"
      implementationScope:
        - "Generate YAML from current source schema and profiled synthetic data."
        - "Validate YAML syntax and schema before use."
        - "Load DQ rules from the YAML into metadata tables for dynamic execution."
        - "Capture validation output with contract ID, version, layer, entity, rule ID, severity, status, expected value, and actual value."
      recommendedMetadataTables:
        - dq_contract_rule_metadata
        - dq_rule_execution_log
        - dq_rule_exception_log
        - dq_contract_rule_version
  - property: breakingChangePolicy
    value: "Removing, renaming, or changing type/nullability of a required field is breaking."


    quality:
      - metric: rowCount
        mustBeGreaterThan: 0
        dimension: completeness
        type: library
        severity: error
        description: "loss_event.csv must not be empty."
      - type: sql
        query: >
          SELECT
            SUM(CASE WHEN concat(incident_id) is null THEN 1 ELSE 0 END) AS pk_nulls,
            COUNT(1) - COUNT(DISTINCT incident_id) AS pk_duplicates
          FROM {full_table_name} a
          WHERE {target_watermak_exp}
        mustBe:
          pk_nulls: 0
          pk_duplicates: 0
        dimension: uniqueness
        severity: error
        description: "rule_0003: Not Null Check - incident_id primary key must be populated and unique."
      - type: sql
        query: >
          SELECT count(*) AS null_count
          FROM {full_table_name} a
          WHERE (incident_id) is null AND {target_watermak_exp}
        mustBe:
          null_count: 0
        dimension: completeness
        severity: error
        description: "rule_0001: BK Check - incident_id business key must not be null."
      - type: sql
        query: >
          SELECT
            SUM(CASE WHEN concat(incident_id) is null THEN 1 ELSE 0 END) AS bk_nulls,
            COUNT(1) - COUNT(DISTINCT incident_id) AS bk_duplicates
          FROM {full_table_name} a
          WHERE {target_watermak_exp}
        mustBe:
          bk_nulls: 0
          bk_duplicates: 0
        dimension: uniqueness
        severity: error
        description: "rule_0007: BK Not Null Check - incident_id business key must be populated and unique."


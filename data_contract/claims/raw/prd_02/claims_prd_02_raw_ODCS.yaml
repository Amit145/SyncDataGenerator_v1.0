    value: 7
    unit: y

team:
  name: "Data Modelling & Engineering CoE"
  description: "Producing team / owner of this contract"
  members:
    - username: "data-modelling-engineering-coe@example-internal"
      role: Owner
      dateIn: "2026-08-07"

